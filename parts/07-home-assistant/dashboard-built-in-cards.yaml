# Staircase v2 · The same controls with built-in cards only (no HACS)
# Explained in: parts/07-home-assistant/README.md
# Paste into: a dashboard section, as four separate manual cards
# Needs: nothing beyond Home Assistant itself
# Search this file for CHANGE and swap in your own entity IDs.

- type: tile
  entity: input_boolean.stairs_s3_moon
  name: Night mode
  icon: mdi:weather-night
  tap_action:
    action: toggle
  grid_options:
    columns: 12
- type: button
  name: Top
  icon: mdi:stairs-down
  show_state: false
  tap_action:
    action: perform-action
    perform_action: script.stairs_s3_software_trigger  # CHANGE: your own script
    data:
      direction: top
  grid_options:
    columns: 6
    rows: 1
- type: button
  name: Bottom
  icon: mdi:stairs-up
  show_state: false
  tap_action:
    action: perform-action
    perform_action: script.stairs_s3_software_trigger  # CHANGE: your own script
    data:
      direction: bottom
  grid_options:
    columns: 6
    rows: 1
- type: tile
  entity: input_select.stairs_s3_mode
  name: Mode
  tap_action:
    action: none
  features:
  - type: select-options
  features_position: bottom
  grid_options:
    columns: 12
