# Staircase v2 · Script – Software trigger (the card's Top / Bottom buttons)
# Explained in: parts/07-home-assistant/README.md
# Paste into: Settings → Automations & scenes → Scripts → ⋮ → Edit in YAML
# Needs: presets 8 (zz Trigger Bottom) and 9 (zz Trigger Top)
# Search this file for CHANGE and swap in your own entity IDs.
#
# Why this exists rather than the cards calling the preset directly: the three
# trigger paths are gated differently. The wall buttons always work, the motion
# sensors obey the house motion toggle, and these card buttons sit in between —
# they only exist while Home Assistant is up, so they respect Power and the
# day/night window, but NOT the motion toggle, which is about motion only.

alias: Staircase v2 – Software trigger
description: >-
  Gate for the dashboard Top/Bottom buttons. Respects Power and the day/night
  window (overridable with Moon). Deliberately does not check the house motion
  toggle: that gates the motion sensors only. The wall buttons on the controller
  bypass Home Assistant entirely and always work.
mode: queued
max: 4

fields:
  direction:
    name: Direction
    description: Which end of the staircase the sweep starts from.
    required: true
    selector:
      select:
        options:
          - top
          - bottom

sequence:
  - condition: state
    entity_id: input_boolean.stairs_s3_power   # CHANGE: your own helper
    state: "on"
    note: Power stops everything Home Assistant drives.

  - condition: or
    conditions:
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      - condition: state
        entity_id: input_boolean.stairs_s3_moon   # CHANGE: your own helper
        state: "on"
    note: Night, or Moon held on to override daylight for a test.

  - action: select.select_option
    target:
      entity_id: select.wled_staircase_preset   # CHANGE: your own entity
    data:
      option: "zz Trigger {{ 'Top' if direction == 'top' else 'Bottom' }}"
    note: Presets 8 and 9 poke the usermod's sensor inputs over JSON.
