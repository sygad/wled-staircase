# Staircase v2 · Script – Software trigger (the card's Top / Bottom buttons)
# Explained in: parts/07-home-assistant/README.md
# Paste into: Settings → Automations & scenes → Scripts → ⋮ → Edit in YAML
# Needs: presets 8 (zz Trigger Bottom) and 9 (zz Trigger Top)
# Search this file for CHANGE and swap in your own entity IDs.
#
# Why this exists rather than the cards calling the preset directly: the four ways
# in are gated differently. The hardware buttons always work, the motion sensors
# obey the house motion toggle, Danger answers to the alarm alone, and these card
# buttons sit in between - they only exist while Home Assistant is up, so they
# respect the day/night window, but NOT the motion toggle, which is about motion.

alias: Staircase v2 – Software trigger
description: >-
  Gate for the dashboard Top/Bottom buttons. Top while the alarm is armed home
  hands over to the Danger automation, before any other check. Otherwise it
  respects the day/night window (overridable with Night mode). Deliberately does
  not check the house motion toggle: that gates the motion sensors only. The
  hardware buttons on the controller bypass Home Assistant entirely and always
  work.
mode: queued
max: 4

fields:
  direction:
    name: Direction
    description: Which end of the staircase the sweep starts from.
    required: true
    selector:
      select:
        options:
          - top
          - bottom

sequence:
  - alias: 'Top button while the alarm is armed: hand over to Danger'
    if:
      - condition: template
        value_template: "{{ direction == 'top' }}"
      - condition: state
        entity_id: alarm_control_panel.home_alarm   # CHANGE: your own entity
        state: armed_home
    then:
      - action: automation.trigger
        target:
          entity_id: automation.staircase_v2_danger
        data:
          skip_condition: false
      - stop: Danger owns the stairs for the next five seconds
    note: >-
      First, and above the day/night check, because Danger outranks everything.
      Without this the card button could never produce Danger - only the Zigbee
      top PIR could, which makes Danger impossible to test from the card.

  - condition: or
    conditions:
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      - condition: state
        entity_id: input_boolean.stairs_s3_moon   # CHANGE: your own helper
        state: "on"
    note: Night, or Night mode held on to override daylight for a test.

  - action: select.select_option
    target:
      entity_id: select.wled_staircase_preset   # CHANGE: your own entity
    data:
      option: "zz Trigger {{ 'Top' if direction == 'top' else 'Bottom' }}"
    note: Presets 8 and 9 poke the usermod's sensor inputs over JSON.
