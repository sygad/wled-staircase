# Staircase v2 · The two helpers (created in the UI, shown here as YAML)
# Explained in: parts/07-home-assistant/README.md
# Paste into: Settings → Devices & services → Helpers (or configuration.yaml)
# Needs: nothing
# Search this file for CHANGE and swap in your own entity IDs.

input_boolean:
  stairs_s3_moon:
    name: Staircase v2 Moon      # shown on the cards as "Night mode"
    icon: mdi:weather-night
input_select:
  stairs_s3_mode:
    name: Staircase v2 Mode
    icon: mdi:stairs
    options:
    - Sweep
    - All
    - Rainbow
    - Matrix
    - Disco
