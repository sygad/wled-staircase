; WLED Staircase v2 · PlatformIO build environments
; Explained in: parts/03-firmware/README.md
; Copy this file into the root of a WLED 16.0.1 checkout, after applying the
; patches in parts/04-behaviour-patches/patches/.
;
; esp32s3_staircase is this project. esp32dev_staircase is the older 33-stair
; classic-ESP32 build, kept here so one checkout still builds both.

[platformio]
default_envs = esp32s3_staircase

; Classic ESP32 (4MB) + Animated Staircase usermod, 48 segments (33 stairs + headroom)
[env:esp32dev_staircase]
extends = env:esp32dev
custom_usermods = Animated_Staircase
build_flags = ${common.build_flags} ${esp32_idf_V4.build_flags}
  -D WLED_RELEASE_NAME=\"ESP32_Staircase\"
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D MAX_NUM_SEGMENTS=48

; Staircase v2: ESP32-S3 N16R8 + 8x64 matrix, Animated Staircase (v2 patches) + audioreactive, 64 segments (one per row)
[env:esp32s3_staircase]
extends = env:esp32s3dev_16MB_opi
custom_usermods = Animated_Staircase audioreactive
build_flags = ${common.build_flags} ${esp32s3.build_flags}
  -D WLED_RELEASE_NAME=\"ESP32-S3_Staircase\"
  -D WLED_WATCHDOG_TIMEOUT=0
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -D MAX_NUM_SEGMENTS=64
  -D STAIRCASE_V2
