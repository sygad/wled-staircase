<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 780" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>WLED Staircase v2 wiring: ESP32-S3, 8x64 matrix, two diagnostic buttons</title>
  <defs>
    <g id="button">
      <rect x="-20" y="-20" width="40" height="40" rx="6" fill="#455a64" stroke="#263238" stroke-width="2"/>
      <circle r="11" fill="#cfd8dc" stroke="#263238" stroke-width="2"/>
      <circle r="5" fill="#90a4ae"/>
    </g>
  </defs>

  <rect width="1120" height="780" rx="16" fill="#ffffff"/>

  <!-- ===== Wires (drawn first so the parts sit on top) ===== -->
  <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 5 V: PSU -> panel 1 input, and injection into panel 2 -->
    <path d="M230 80 H650" stroke="#d32f2f"/>
    <path d="M230 80 V40 H1075 V95" stroke="#d32f2f"/>
    <!-- GND: PSU -> panel 1, injection return, and the ESP32's common ground -->
    <path d="M230 120 H650" stroke="#263238"/>
    <path d="M230 120 V150 H1055 V95" stroke="#263238"/>
    <path d="M300 310 H262 V120" stroke="#263238"/>
    <!-- LED data: GPIO 12 -> panel 1 DIN -->
    <path d="M530 290 H600 V190 H650" stroke="#2e7d32"/>
    <!-- Top button: GPIO 5 -> button -> ground rail -->
    <path d="M530 360 H740" stroke="#1565c0"/>
    <path d="M780 360 H980" stroke="#263238"/>
    <!-- Bottom button: GPIO 4 -> button -> ground rail -->
    <path d="M530 440 H740" stroke="#8e24aa"/>
    <path d="M780 440 H980" stroke="#263238"/>
    <!-- Ground rail back to the ESP32 -->
    <path d="M980 360 V600 H560 V520 H530" stroke="#263238"/>
  </g>

  <!-- junction dots -->
  <g fill="#263238">
    <circle cx="262" cy="120" r="7"/>
    <circle cx="980" cy="440" r="7"/>
  </g>
  <circle cx="230" cy="80" r="7" fill="#d32f2f"/>

  <!-- ===== Power supply ===== -->
  <rect x="40" y="40" width="190" height="120" rx="10" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/>
  <text x="135" y="86" text-anchor="middle" font-size="17" font-weight="700" fill="#263238">5 V 20 A supply</text>
  <text x="135" y="108" text-anchor="middle" font-size="13" fill="#546e7a">for the panels only</text>
  <text x="135" y="128" text-anchor="middle" font-size="13" fill="#546e7a">(limiter set to 17 A)</text>
  <circle cx="230" cy="80" r="7" fill="#d32f2f" stroke="#fff" stroke-width="2"/>
  <circle cx="230" cy="120" r="7" fill="#263238" stroke="#fff" stroke-width="2"/>
  <text x="243" y="72" font-size="13" font-weight="700" fill="#d32f2f">+5V</text>
  <text x="243" y="140" font-size="13" font-weight="700" fill="#263238">GND</text>

  <text x="258" y="222" text-anchor="end" font-size="13" font-weight="700" fill="#263238">Common ground</text>
  <text x="258" y="239" text-anchor="end" font-size="12" fill="#546e7a">the ESP32-S3 GND joins</text>
  <text x="258" y="254" text-anchor="end" font-size="12" fill="#546e7a">the supply GND</text>

  <!-- ===== The two panels, chained into one 8x64 matrix ===== -->
  <text x="860" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">Two 32x8 WS2812B panels, chained into one 8 x 64 matrix (512 LEDs)</text>
  <rect x="648" y="60" width="200" height="130" rx="8" fill="#fafafa" stroke="#bdbdbd" stroke-width="2"/>
  <rect x="868" y="60" width="200" height="130" rx="8" fill="#fafafa" stroke="#bdbdbd" stroke-width="2"/>
  <g fill="#c9a227">
    <rect x="648" y="72" width="26" height="16" rx="3"/>
    <rect x="648" y="112" width="26" height="16" rx="3"/>
    <rect x="648" y="182" width="26" height="16" rx="3"/>
  </g>
  <text x="680" y="85" font-size="13" font-weight="700" fill="#d32f2f">+5V</text>
  <text x="680" y="125" font-size="13" font-weight="700" fill="#263238">GND</text>
  <text x="680" y="196" font-size="13" font-weight="700" fill="#2e7d32">DIN</text>
  <g fill="#ffd54f" stroke="#9e9e9e">
    <rect x="700" y="100" width="22" height="22" rx="3"/><rect x="732" y="100" width="22" height="22" rx="3"/>
    <rect x="764" y="100" width="22" height="22" rx="3"/><rect x="796" y="100" width="22" height="22" rx="3"/>
    <rect x="900" y="100" width="22" height="22" rx="3"/><rect x="932" y="100" width="22" height="22" rx="3"/>
    <rect x="964" y="100" width="22" height="22" rx="3"/><rect x="996" y="100" width="22" height="22" rx="3"/>
  </g>
  <path d="M848 125 H868" fill="none" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/>
  <text x="858" y="152" text-anchor="middle" font-size="11" fill="#546e7a">chained</text>
  <text x="748" y="52" text-anchor="middle" font-size="12" fill="#546e7a">panel 1 (rows 1-32)</text>
  <text x="968" y="52" text-anchor="middle" font-size="12" fill="#546e7a">panel 2 (rows 33-64)</text>
  <circle cx="1075" cy="95" r="7" fill="#d32f2f" stroke="#fff" stroke-width="2"/>
  <circle cx="1055" cy="95" r="7" fill="#263238" stroke="#fff" stroke-width="2"/>
  <text x="1090" y="118" text-anchor="end" font-size="12" font-weight="700" fill="#d32f2f">power injection</text>
  <text x="1090" y="134" text-anchor="end" font-size="12" fill="#546e7a">at the far end</text>

  <!-- ===== ESP32-S3 board ===== -->
  <rect x="300" y="250" width="230" height="330" rx="12" fill="#1e3a5f" stroke="#0d2238" stroke-width="2"/>
  <rect x="345" y="272" width="120" height="120" rx="6" fill="#b0bec5" stroke="#78909c" stroke-width="2"/>
  <text x="405" y="325" text-anchor="middle" font-size="16" font-weight="700" fill="#263238">ESP32-S3</text>
  <text x="405" y="346" text-anchor="middle" font-size="12" fill="#37474f">N16R8</text>
  <text x="405" y="364" text-anchor="middle" font-size="11" fill="#37474f">16 MB / 8 MB PSRAM</text>
  <text x="415" y="420" text-anchor="middle" font-size="13" fill="#cfd8dc">diymore</text>
  <text x="415" y="438" text-anchor="middle" font-size="13" fill="#cfd8dc">DevKitC-1</text>
  <g fill="#c9a227" stroke="#fff" stroke-width="1.5">
    <circle cx="300" cy="310" r="6"/>
    <circle cx="530" cy="290" r="6"/>
    <circle cx="530" cy="360" r="6"/>
    <circle cx="530" cy="440" r="6"/>
    <circle cx="530" cy="520" r="6"/>
  </g>
  <g font-size="13" font-weight="700" fill="#ffffff">
    <text x="312" y="315">GND</text>
    <text x="518" y="295" text-anchor="end">GPIO 12</text>
    <text x="518" y="365" text-anchor="end">GPIO 5</text>
    <text x="518" y="445" text-anchor="end">GPIO 4</text>
    <text x="518" y="525" text-anchor="end">GND</text>
  </g>
  <rect x="400" y="572" width="30" height="20" rx="3" fill="#9e9e9e" stroke="#616161"/>
  <text x="415" y="612" text-anchor="middle" font-size="12" fill="#546e7a">USB-C to the computer</text>
  <text x="415" y="628" text-anchor="middle" font-size="12" font-weight="700" fill="#c62828">USB or the 5 V supply,</text>
  <text x="415" y="644" text-anchor="middle" font-size="12" font-weight="700" fill="#c62828">never both at once</text>

  <!-- ===== Diagnostic-only callout: these buttons are not the way the stairs are used ===== -->
  <rect x="648" y="206" width="444" height="110" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="670" y="230" font-size="14" font-weight="700" fill="#e65100">Both buttons are DIAGNOSTIC ONLY</text>
  <text x="670" y="250" font-size="12" fill="#4e342e">They override everything: day or night, the house motion toggle,</text>
  <text x="670" y="266" font-size="12" fill="#4e342e">the alarm, Home Assistant being down. Their only job is to prove</text>
  <text x="670" y="282" font-size="12" fill="#4e342e">the controller and the LEDs still work. Rarely used, locked away.</text>
  <text x="670" y="304" font-size="12.5" font-weight="700" fill="#2e7d32">The PIR sensors drive the stairs — Zigbee, nothing wired here.</text>

  <!-- ===== Buttons ===== -->
  <use href="#button" x="760" y="360"/>
  <text x="790" y="340" font-size="14" font-weight="700" fill="#1565c0">TOP button</text>
  <text x="790" y="324" font-size="12" fill="#546e7a">GPIO 5 to GND</text>
  <use href="#button" x="760" y="440"/>
  <text x="790" y="476" font-size="14" font-weight="700" fill="#8e24aa">BOTTOM button</text>
  <text x="790" y="492" font-size="12" fill="#546e7a">GPIO 4 to GND</text>
  <text x="1000" y="400" font-size="12" font-weight="700" fill="#263238">GND rail</text>
  <text x="600" y="500" font-size="13" font-weight="700" fill="#263238">No resistors</text>
  <text x="600" y="517" font-size="12" fill="#546e7a">the firmware turns on the</text>
  <text x="600" y="532" font-size="12" fill="#546e7a">ESP32's internal pull-ups,</text>
  <text x="600" y="547" font-size="12" fill="#546e7a">so a press pulls the pin LOW</text>

  <!-- ===== Microphone, not fitted yet ===== -->
  <rect x="640" y="620" width="440" height="100" rx="10" fill="#fafafa" stroke="#90a4ae" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="860" y="650" text-anchor="middle" font-size="14" font-weight="700" fill="#546e7a">INMP441 microphone — planned, not fitted</text>
  <text x="860" y="674" text-anchor="middle" font-size="12.5" fill="#546e7a">VDD → 3V3 · GND → GND · L/R → GND</text>
  <text x="860" y="696" text-anchor="middle" font-size="12.5" fill="#546e7a">SCK → GPIO 13 · WS → GPIO 14 · SD → GPIO 15</text>
  <text x="860" y="713" text-anchor="middle" font-size="11.5" fill="#78909c">needed only by the Disco preset's sound-reactive bars</text>

  <!-- ===== Legend ===== -->
  <g font-size="13" fill="#263238" stroke-width="5" stroke-linecap="round">
    <line x1="40" y1="750" x2="70" y2="750" stroke="#d32f2f"/><text x="78" y="755" stroke="none">5 V</text>
    <line x1="130" y1="750" x2="160" y2="750" stroke="#263238"/><text x="168" y="755" stroke="none">Ground</text>
    <line x1="245" y1="750" x2="275" y2="750" stroke="#2e7d32"/><text x="283" y="755" stroke="none">LED data</text>
    <line x1="370" y1="750" x2="400" y2="750" stroke="#1565c0"/><text x="408" y="755" stroke="none">Top trigger</text>
    <line x1="505" y1="750" x2="535" y2="750" stroke="#8e24aa"/><text x="543" y="755" stroke="none">Bottom trigger</text>
  </g>
  <text x="1080" y="755" text-anchor="end" font-size="12" fill="#546e7a">Pressing a button connects its GPIO to ground · more buttons need their own GPIOs</text>
</svg>
