; Copy this file into the root of the WLED v16.0.1 source tree, next to platformio.ini.
; Classic ESP32 (4MB) + Animated Staircase usermod, 48 segments (33 stairs + headroom).
; Set MAX_NUM_SEGMENTS to the value tools/make_wled_config.py prints for your stairs.
; Needs patch 0001 (FX.h) or the -D MAX_NUM_SEGMENTS flag is ignored.

[platformio]
default_envs = esp32dev_staircase

[env:esp32dev_staircase]
extends = env:esp32dev
custom_usermods = Animated_Staircase
build_flags = ${common.build_flags} ${esp32_idf_V4.build_flags}
  -D WLED_RELEASE_NAME=\"ESP32_Staircase\"
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D MAX_NUM_SEGMENTS=48
